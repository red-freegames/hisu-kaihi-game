const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const rnum = r => (r === "MAIN" ? 100 : r);   // 並べ替え用（本命を最上位扱い）
const pick = a => a[(Math.random() * a.length) | 0];
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = (Math.random() * (i + 1)) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; };
const load = (k, d) => { try { return JSON.parse(localStorage.getItem(k)) || d; } catch (e) { return d; } };
const save = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };

/* ===== 表情イラスト（通常 / 爆発 の静止画切り替えのみ） ===== */
function faceSVG(ch, angry) {
  const skin = angry ? "#ff7466" : "#ffd9bd";
  const eyes = angry
    ? '<path d="M36 50 L52 57 M84 50 L68 57" stroke="#2a1a14" stroke-width="5" stroke-linecap="round"/><circle cx="45" cy="63" r="4"/><circle cx="75" cy="63" r="4"/>'
    : '<path d="M37 52 L51 54 M83 52 L69 54" stroke="#2a1a14" stroke-width="4" stroke-linecap="round"/><circle cx="45" cy="62" r="4"/><circle cx="75" cy="62" r="4"/>';
  const mouth = angry
    ? '<path d="M44 82 Q60 70 76 82 L72 94 Q60 88 48 94 Z" fill="#7a0d0d" stroke="#2a1a14" stroke-width="3"/><path d="M48 82 L72 82" stroke="#fff" stroke-width="4"/>'
    : '<path d="M48 84 Q60 80 72 84" fill="none" stroke="#2a1a14" stroke-width="4" stroke-linecap="round"/>';
  const vein = angry ? '<text x="84" y="34" font-size="26">💢</text><path d="M10 30 l8 6 M14 20 l6 9 M106 64 l8 -4" stroke="#e8262b" stroke-width="4" stroke-linecap="round"/>' : "";
  let back = "", front = "";
  if (ch === "クレーマー") {
    back = '<rect x="38" y="104" width="44" height="20" fill="#3a4a7a"/><path d="M56 104 L64 104 L66 120 L60 124 L54 120Z" fill="#e8262b"/>';
    front = '<path d="M22 58 Q20 40 30 40 L30 62Z M98 58 Q100 40 90 40 L90 62Z" fill="#555"/><path d="M42 76 Q60 70 78 76 Q60 74 42 76Z" fill="#444" stroke="#444" stroke-width="4"/><ellipse cx="60" cy="26" rx="14" ry="5" fill="#fff" opacity=".5"/>';
  } else if (ch === "彼女") {
    back = '<path d="M18 60 Q14 16 60 14 Q106 16 102 60 L106 110 L84 110 L84 60 L36 60 L36 110 L14 110Z" fill="#8a4b3a"/>';
    front = '<path d="M26 50 Q30 18 60 18 Q90 18 94 50 Q80 34 62 40 Q48 30 26 50Z" fill="#8a4b3a"/><path d="M78 18 l14 -8 l2 14 Z M78 18 l-2 -14 l14 8Z" fill="#ff6fa8"/><circle cx="36" cy="74" r="6" fill="#ff9aa8" opacity=".6"/><circle cx="84" cy="74" r="6" fill="#ff9aa8" opacity=".6"/>';
  } else {
    back = '<circle cx="60" cy="14" r="13" fill="#5a3a2e"/>';
    front = '<path d="M24 52 Q22 22 60 22 Q98 22 96 52 Q88 36 60 34 Q32 36 24 52Z" fill="#5a3a2e"/><g fill="none" stroke="#2a1a14" stroke-width="3"><circle cx="45" cy="62" r="10"/><circle cx="75" cy="62" r="10"/><path d="M55 62 L65 62"/></g><path d="M40 104 Q60 114 80 104 L84 124 L36 124Z" fill="#f4a3b5"/>';
  }
  return `<svg viewBox="0 0 120 124" xmlns="http://www.w3.org/2000/svg">${back}<ellipse cx="60" cy="62" rx="38" ry="42" fill="${skin}" stroke="#2a1a14" stroke-width="3"/>${eyes}${mouth}${front}${vein}</svg>`;
}

/* =====================================================================
 *  ゲーム状態
 * ===================================================================== */
const S = { mode: null, q: 0, deck: [], cur: null, shown: [], endless: false, lock: false, last: null, resultAt: 0 };
const POOL = {};
CONST_QUESTIONS.forEach(q => (POOL[q.character] = POOL[q.character] || []).push(q));
let toastTimer;

function show(id) {
  document.querySelectorAll(".screen").forEach(s => s.classList.toggle("on", s.id === id));
  window.scrollTo(0, 0);
}

function renderTitle() {
  const best = load(LS.best, {});
  $("diffs").innerHTML = Object.entries(MODES).map(([k, m]) => `
    <button class="diff" data-mode="${k}">${faceSVG(m.char, false)}
      <div><span class="lv ${m.cls}">${m.label}</span><b>${m.title}</b>
      <small>${m.goal}問連続クリアで訓練完了${m.endless ? "／突破で隠しステージ…？" : ""}<br>自己ベスト：${best[k] ? best[k] + "問目" : "—"}</small></div></button>`).join("");
  const z = load(LS.zukan, {});
  $("zkTitle").textContent = `📖 地雷セリフ図鑑：${Object.keys(z).length} / ${CONST_QUESTIONS.length * 4} 解除済み`;
  document.body.classList.remove("hell");
  show("title");
}

function start(mode) {
  S.mode = mode; S.q = 1; S.endless = false; S.lock = false; S.deck = [];
  document.body.classList.remove("hell");
  $("hellban").classList.remove("on");
  next();
  show("game");
}

// 本命の現在の生存率
function mainRate() {
  if (!S.endless) return MODES[S.mode].main;
  const i = S.q - MODES[S.mode].goal - 1;
  return CONFIG.ENDLESS_RATES[Math.min(i, CONFIG.ENDLESS_RATES.length - 1)];
}

function next() {
  const m = MODES[S.mode];
  if (!S.deck.length) S.deck = shuffle(S.endless ? CONST_QUESTIONS : POOL[m.char]).filter(q => q !== S.cur);
  const q = S.cur = S.deck.pop();
  S.shown = shuffle(q.options.map((o, i) => ({ ...o, idx: i })));
  $("stage").textContent = S.endless ? "隠しステージ：無限地獄編" : `${m.label}：${m.title}`;
  $("qn").textContent = S.endless ? `${S.q}問目` : `${S.q} / ${m.goal}`;
  $("bar").style.width = S.endless ? "100%" : ((S.q - 1) / m.goal * 100) + "%";
  $("face").innerHTML = faceSVG(q.character, false);
  $("prompt").textContent = q.prompt;
  $("who").textContent = "▲ " + (S.endless ? q.character : m.title);
  const bp = 120 + ((Math.random() * 80) | 0);
  $("mood").innerHTML = `現在の機嫌：<b>血圧${bp}</b>／直前の出来事：${esc(pick(CHARS[q.character].moods.concat(COMMON_MOODS)))}`;
  $("opts").innerHTML = S.shown.map((o, i) => `<button class="opt" data-i="${i}"><span class="k">${"ABCD"[i]}</span><span>${esc(o.text)}</span></button>`).join("");
  S.lock = false;
}

function choose(i) {
  if (S.lock || !S.shown[i]) return;
  S.lock = true;
  const o = S.shown[i];
  const rate = o.rate === "MAIN" ? mainRate() : o.rate;
  const survive = Math.random() * 100 < rate;   // ← 確率判定
  if (!survive) return die(o, rate);

  toast(`回避成功！（生存率${rate}%を突破）`);
  S.q++;
  const m = MODES[S.mode];
  if (!S.endless && S.q > m.goal) {
    if (m.endless) {               // HARD突破 → 隠しステージへ
      S.endless = true; S.deck = [];
      document.body.classList.add("hell");
      $("hellban").classList.add("on");
    } else return finish(true);
  }
  next();
}

function die(o, rate) {
  const q = S.cur;
  S.last = { q, o, rate, main: mainRate(), fail: q.failure_messages[o.idx], reached: S.q, endless: S.endless, clear: false };
  // 図鑑登録
  const z = load(LS.zukan, {}), key = q.id + ":" + o.idx;
  S.last.isNew = !z[key];
  z[key] = (z[key] || 0) + 1; save(LS.zukan, z);
  document.body.classList.add("flash");
  setTimeout(() => document.body.classList.remove("flash"), 260);
  finish(false);
}

function finish(clear) {
  const m = MODES[S.mode];
  if (clear) S.last = { clear: true, reached: m.goal, endless: false };
  const best = load(LS.best, {});
  const isBest = S.last.reached > (best[S.mode] || 0);
  if (isBest) { best[S.mode] = S.last.reached; save(LS.best, best); }
  renderResult(isBest);
  S.resultAt = Date.now();
  show("result");
}

function renderResult(isBest) {
  const L = S.last, m = MODES[S.mode];
  const char = L.clear ? m.char : L.q.character;
  if (L.clear) {
    $("boom").className = "boom clear";
    $("boom").innerHTML = `<h2>🎉 訓練完了！</h2><div class="face">${faceSVG(char, false)}</div>
      <div class="roar">${m.title}を${m.goal}問連続で回避した！</div>
      <div class="prob">今日の運と直感は本物だ。だが明日の機嫌は誰にも読めない……</div>`;
  } else if (L.rate === 0) {
    $("boom").className = "boom ng";
    $("boom").innerHTML = `<h2>【絶対NG！】<br>ありえない選択肢！</h2><div class="face">${faceSVG(char, true)}</div>
      <div class="roar">「${esc(pick(CHARS[char].roars))}」</div>
      <div class="prob">⚠ 生存率 <em>0%</em> ── これは次から絶対に選んではいけない地雷！</div>`;
  } else {
    $("boom").className = "boom";
    const main = L.o.rate === "MAIN";
    $("boom").innerHTML = `<h2>💥 爆死！${main ? "（地雷変化）" : ""}</h2><div class="face">${faceSVG(char, true)}</div>
      <div class="roar">「${esc(pick(CHARS[char].roars))}」</div>
      <div class="prob">生存率<em>${L.rate}%</em>の選択肢で、<em>${100 - L.rate}%</em>の機嫌変化を引き当てて死亡</div>`;
  }
  const best = load(LS.best, {});
  $("recNow").textContent = `${L.reached}問目` + (L.clear ? "" : "");
  $("recBest").innerHTML = `${best[S.mode] || 0}問目${isBest ? ' <small style="color:var(--red)">NEW!</small>' : ""}`;

  if (L.clear) {
    $("cause").innerHTML = `<div class="h">🏆 結果</div>${esc(m.title)}の訓練を完了！${S.mode !== "HARD" ? "次はさらに理不尽な相手が待っている……" : ""}`;
  } else {
    const sel = L.o.idx;
    $("cause").innerHTML = `<div class="h">💀 敗因（${L.endless ? "隠しステージ・" : ""}${L.reached}問目）</div>
      <q>${esc(L.o.text)}</q> → 「${esc(L.fail)}」
      <div class="h" style="margin-top:8px">🔍 答え合わせ（隠し生存率）</div>
      <ul class="ans">${L.q.options.map((o, i) => ({ o, i })).sort((a, b) => rnum(b.o.rate) - rnum(a.o.rate)).map(({ o, i }) => {
        return `<li class="${i === sel ? "me" : ""}"><span class="badge r${o.rate}">${o.rate === "MAIN" ? "本命" + L.main + "%" : o.rate + "%"}</span><span>${esc(o.text)}</span></li>`;
      }).join("")}</ul>`;
  }
  $("nextBtn").style.display = S.mode === "HARD" ? "none" : "";
  $("nextBtn").textContent = S.mode === "EASY" ? "NORMALへ" : "HARDへ";
  renderZukan(L.clear ? null : L.q.id + ":" + L.o.idx);
}

function renderZukan(newKey) {
  const z = load(LS.zukan, {});
  const items = [];
  CONST_QUESTIONS.forEach(q => q.options.forEach((o, i) => { const k = q.id + ":" + i; if (z[k]) items.push({ q, o, i, k, n: z[k] }); }));
  items.sort((a, b) => (b.k === newKey) - (a.k === newKey) || rnum(a.o.rate) - rnum(b.o.rate));
  $("zkSum").textContent = `📖 解除した地雷セリフ図鑑（${items.length} / ${CONST_QUESTIONS.length * 4}）`;
  $("zkList").innerHTML = items.length ? items.map(x => `<li class="${x.k === newKey ? "new" : ""}">
      <span class="badge r${x.o.rate}">${x.o.rate === "MAIN" ? "本命" : x.o.rate + "%"}</span> <b>${esc(x.o.text)}</b>${x.k === newKey && S.last.isNew ? ' <b style="color:var(--red)">NEW</b>' : ""}<br>
      <span class="who2">vs ${esc(x.q.character)}「${esc(x.q.prompt)}」 ／ 敗因：${esc(x.q.failure_messages[x.i])} ／ 被弾${x.n}回</span></li>`).join("")
    : "<li>まだ地雷を踏んでいない……</li>";
}

function share() {
  const L = S.last;
  let cause;
  if (L.clear) cause = `敗因なし！${MODES[S.mode].title}の訓練を完了`;
  else if (L.rate === 0) cause = `絶対NG「${L.o.text}」を選んで即爆死（学習不足）`;
  else if (L.o.rate === "MAIN") cause = `${L.rate}%の安牌を選んだのに「${L.fail}」で爆死（地雷変化）`;
  else cause = `生存率${L.rate}%に賭けたが「${L.fail}」で爆死`;
  const text = `【ヒス回避ゲーム】対ヒス訓練で『${L.reached}問目』まで生き残った！！\n` +
    `👉 記録：【${L.reached}問目】到達${L.endless ? "（隠しステージ突入！）" : `（${MODES[S.mode].label}）`}\n` +
    `💀 最後の敗因：『${cause}』\n${CONFIG.HASHTAGS} ${CONFIG.SHARE_URL}`;
  window.open("https://twitter.com/intent/tweet?text=" + encodeURIComponent(text), "_blank", "noopener");
}

function toast(msg) {
  const t = $("toast"); t.textContent = msg; t.classList.add("on");
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove("on"), 700);
}

/* =====================================================================
 *  入力
 * ===================================================================== */
$("diffs").addEventListener("click", e => { const b = e.target.closest("[data-mode]"); if (b) start(b.dataset.mode); });
$("opts").addEventListener("click", e => { const b = e.target.closest(".opt"); if (b) choose(+b.dataset.i); });
$("result").addEventListener("click", e => {
  if (Date.now() - S.resultAt < 100) return;              // 連打による誤リトライ防止（0.1秒）
  if (e.target.closest("details")) return;
  const b = e.target.closest("[data-act]");
  const act = b ? b.dataset.act : "retry";                 // 画面のどこをタップしても即リトライ
  if (act === "retry") start(S.mode);
  else if (act === "share") share();
  else if (act === "title") renderTitle();
  else if (act === "next") start(S.mode === "EASY" ? "NORMAL" : "HARD");
});
document.addEventListener("keydown", e => {
  if ($("game").classList.contains("on")) {
    const i = "1234".indexOf(e.key) >= 0 ? "1234".indexOf(e.key) : "abcd".indexOf(e.key.toLowerCase());
    if (i >= 0) choose(i);
  } else if ($("result").classList.contains("on") && (e.key === "Enter" || e.key === " ") && Date.now() - S.resultAt > 100) {
    e.preventDefault(); start(S.mode);
  } else if (e.key === "Escape") renderTitle();
});
$("coffee").href = CONFIG.COFFEE_URL;
renderTitle();
</script>
</body>
</html>
