 *  設問データ（CONST_QUESTIONS）

 *                    実際の生存率は難易度ごとの MODES.rates で決まる（EASYは正解100%・それ以外0%の完全ロジック）

 *      deathReason : 爆死した時の相手のキレ理由（この選択肢専用。画面上部と敗因で同じ文を表示）

 *   - 全設問に「選べば回避できる正解（MAIN）」が必ず1つある。EASYは運要素ゼロ（正解なら必ず生存・不正解なら必ず爆死）、

 *   - クレーマーの「確認してまいります」系の逃げ回答は絶対NG（deathReason: ESCAPE_NG）
 * ===================================================================== */

      { text: "お母さんもつけっぱなしだったよ", rate: 0, deathReason: "お母さんはいいの！あんたの話をしてるの！" } ] },
  { id: "M014", character: "母親", prompt: "今の言い方なに？",
    options: [
      { text: "ごめん。イライラしてて八つ当たりした。お母さんのせいじゃない", rate: "MAIN", reaction: "……分かればいいのよ。何かあったの？", deathReason: "八つ当たりって、お母さんはサンドバッグなの！？" },
      { text: "ごめん、言い方が悪かった", rate: 40, reaction: "……分かればいいのよ", deathReason: "言い方だけ！？中身も悪かったでしょ！" },
      { text: "普通に言っただけだよ", rate: 10, reaction: "……そう？ならいいけど", deathReason: "それが普通なら、普段からそう思ってるってことね！" },
      { text: "そっちの言い方こそ何？", rate: 0, deathReason: "親に向かってなんて口の利き方なの！" } ] },
  { id: "M015", character: "母親", prompt: "部屋に勝手に入るなって何よ！親でしょ！",
    options: [
      { text: "嫌いだからじゃないよ。一声かけてくれたら、ちゃんとドア開けるから", rate: "MAIN", reaction: "……分かったわよ、ノックする", deathReason: "ドアを開けるか決めるのはあんたなの！？" },
      { text: "ノックしてくれたら嬉しいな", rate: 40, reaction: "……覚えてたらね", deathReason: "自分の家で親がノックしなきゃいけないの！？" },
      { text: "プライバシーってものがあるんだよ", rate: 10, reaction: "……そういう年頃ね", deathReason: "プライバシーなんて言葉、どこで覚えてきたの！" },
      { text: "親でも他人だよ", rate: 0, deathReason: "他人！？今まで育ててきたのに！？" } ] },
  { id: "M016", character: "母親", prompt: "もういい！お母さん出ていくから！",
    options: [
      { text: "行かないで。何が一番嫌だったか教えて。そこから直す", rate: "MAIN", reaction: "……分かったわよ。座りなさい", deathReason: "『そこから』って、他にも直すところがあるの分かってるのね！？" },
      { text: "待って、ごめん。ちゃんと話そう", rate: 40, reaction: "……分かったわよ", deathReason: "引き止めるのが遅い！本当は出ていってほしいんでしょ！" },
      { text: "落ち着いて、ね？", rate: 10, reaction: "……落ち着いてるわよ", deathReason: "落ち着いてるわよ！！落ち着いてないのはそっちでしょ！！" },
      { text: "いってらっしゃい", rate: 0, deathReason: "本当に止めないのね！？" } ] },

  // ───────────── 鬼嫁（鬼モード）：正解は筋が通っているのに、それでも容赦なくキレられる ─────────────
  { id: "O001", character: "鬼嫁", prompt: "私の誕生日、何くれるつもり？……まさか忘れてないよね？（誕生日は昨日）",
    options: [
      { text: "忘れてない。昨日は渡す勇気が出なかった。……遅れてごめん、今渡す", rate: "MAIN", reaction: "……なんで昨日渡さないのよ。……ありがと", deathReason: "勇気ってなに！？私が怖いってこと！？" },
      { text: "今日が本番だと思ってた！今から一緒に選びに行こう", rate: 40, reaction: "……仕方ないわね。高いやつね", deathReason: "昨日が誕生日だって分かってて言ってるの！？" },
      { text: "サプライズで来週やる予定だったんだ", rate: 10, reaction: "……来週ね。期待してるから", deathReason: "来週！？誕生日を何だと思ってるの！" },
      { text: "え、昨日だったっけ？", rate: 0, deathReason: "鬼の誕生日を忘れるとは、いい度胸ね……" } ] },
  { id: "O002", character: "鬼嫁", prompt: "あんたの母親から電話あったんだけど。私と母親、どっちの味方？",
    options: [
      { text: "君の味方。母さんには俺から話す。君に直接は言わせない", rate: "MAIN", reaction: "……ちゃんと言ってよね", deathReason: "あんたが話すと、全部丸く収めて終わりにするでしょ！" },
      { text: "どっちの味方とかじゃなくて、二人で話し合おう", rate: 40, reaction: "……あんたも同席するならね", deathReason: "私と母親を二人きりにする気！？地獄よ！" },
      { text: "母さんも悪気はないんだよ", rate: 10, reaction: "……悪気がないのが一番タチ悪いのよ", deathReason: "やっぱり母親の味方なんじゃない！" },
      { text: "母さんの言うことにも一理あるよ", rate: 0, deathReason: "一理！？その一理で私の人生を削るつもり！？" } ] },
  { id: "O003", character: "鬼嫁", prompt: "今日、私が何回ため息ついたか数えてた？",
    options: [
      { text: "数えてない。でも3回目くらいから、何かあったんだろうなって思ってた", rate: "MAIN", reaction: "……7回よ。聞いてよね", deathReason: "3回目から気付いてて、ずっと黙ってたの！？" },
      { text: "ごめん、気付いてなかった。何があったの？", rate: 40, reaction: "……ずっと待ってたのよ", deathReason: "7回もついたのに気付かないって、どういう神経！？" },
      { text: "ため息つくと幸せが逃げるよ", rate: 10, reaction: "……誰のせいよ", deathReason: "幸せならとっくに逃げてるわよ！あんたと結婚した日に！" },
      { text: "数えてほしかったの？", rate: 0, deathReason: "数えるくらいの関心も持てないの！？" } ] },
  { id: "O004", character: "鬼嫁", prompt: "この家の家事、あんたどれくらいやってると思う？",
    options: [
      { text: "正直、2割もやってない。今日から洗濯と皿洗いは全部やる", rate: "MAIN", reaction: "……やっと気付いたのね。続けなさいよ", deathReason: "2割『も』！？1割もやってないわよ！" },
      { text: "半分くらいはやってるつもりだけど……", rate: 40, reaction: "……つもり、ね。見てるからね", deathReason: "つもり！？そのつもりの差が戦争を生むのよ！" },
      { text: "仕事してるから、家のことは任せてるつもり", rate: 10, reaction: "……任された覚えはないけど", deathReason: "私も仕事してるんだけど！？" },
      { text: "8割はやってるでしょ", rate: 0, deathReason: "8割！？どこの世界線の話！？" } ] },
  { id: "O005", character: "鬼嫁", prompt: "私が髪切ったの、気付いた？",
    options: [
      { text: "気付いてた。前髪、少し短くして顔が明るく見える", rate: "MAIN", reaction: "……へえ、ちゃんと見てるじゃない", deathReason: "『明るく見える』って、前は暗かったってこと！？" },
      { text: "うん、似合ってるよ！", rate: 40, reaction: "……どこ切ったか分かってる？まあいいわ", deathReason: "どこを切ったか言ってみなさいよ！ほら言えない！" },
      { text: "あ、ほんとだ。いつ切ったの？", rate: 10, reaction: "……3日前よ", deathReason: "3日前よ！3日間気付かなかったのね！" },
      { text: "切った？変わってないけど", rate: 0, deathReason: "1cm切ったのよ！？1cmの愛情もないわけ！？" } ] },
  { id: "O006", character: "鬼嫁", prompt: "なんでスマホ伏せて置いてるの？見られたらマズいものでもあるの？",
    options: [
      { text: "ないよ。見たいなら見ていい。（ロックを解除して渡す）", rate: "MAIN", reaction: "……別に見ないわよ。でも、ならいいわ", deathReason: "そんなにあっさり渡すなんて、消した後なんでしょ！" },
      { text: "画面が光るのが嫌で、いつも伏せてるだけだよ", rate: 40, reaction: "……ふーん。まあいいわ", deathReason: "『いつも』って、いつも何か隠してるってことね！" },
      { text: "疑うなんてひどいな", rate: 10, reaction: "……疑わせるようなことしないで", deathReason: "ひどいのはどっちよ！疑わせる方が悪いの！" },
      { text: "プライバシーってものがあるでしょ", rate: 0, deathReason: "夫婦にプライバシーなんかないのよ！！" } ] },
  { id: "O007", character: "鬼嫁", prompt: "疲れた。……で、あんたは今日何してたの？",
    options: [
      { text: "君ほどじゃないけど働いてた。今日は晩ご飯作るから、座ってて", rate: "MAIN", reaction: "……じゃあお願い。辛くしないでね", deathReason: "『君ほどじゃないけど』って、私の疲れをナメてるの！？" },
      { text: "俺も疲れたよ……今日大変でさ", rate: 40, reaction: "……あんたも大変だったのね", deathReason: "疲れ自慢してくるんじゃないわよ！先に私をねぎらいなさい！" },
      { text: "お疲れさま！何かあった？", rate: 10, reaction: "……ちょっと聞いてくれる？", deathReason: "何かあったかって、あんたのせいで疲れてるのよ！" },
      { text: "ゲームしてた", rate: 0, deathReason: "正直に言えば許されると思ってるの！？" } ] },
  { id: "O008", character: "鬼嫁", prompt: "結婚記念日のディナー、なんでこの店にしたの？",
    options: [
      { text: "プロポーズした店だから。あの時と同じ窓際の席を取った", rate: "MAIN", reaction: "……覚えてたのね。……ずるい", deathReason: "窓際って外から丸見えじゃない！泣いてるとこ見られたらどうするの！" },
      { text: "口コミで評判がよかったから", rate: 40, reaction: "……まあ、美味しいなら許す", deathReason: "記念日を口コミで決めたの！？私たちの思い出は！？" },
      { text: "君が前に行きたいって言ってたから", rate: 10, reaction: "……言ったっけ。まあいいわ", deathReason: "それ言ったの、テレビで見た別の店の話よ！" },
      { text: "予約が取れたのがここだけだった", rate: 0, deathReason: "妥協！？結婚記念日を妥協で済ませたの！？" } ] },
  { id: "O009", character: "鬼嫁", prompt: "私、太った？……正直に言って。怒らないから",
    options: [
      { text: "俺は気にならない。君が気になるなら、一緒に歩く時間を作ろう", rate: "MAIN", reaction: "……じゃあ明日から一緒ね", deathReason: "『俺は気にならない』って、他の人は気にするってこと！？" },
      { text: "全然太ってないよ", rate: 40, reaction: "……ほんと？信じるからね", deathReason: "正直に言ってって言ったでしょ！？嘘つき！" },
      { text: "ちょっとだけ、ふっくらしたかも", rate: 10, reaction: "……やっぱり。言ってくれてありがと", deathReason: "怒らないって言ったけど、限度ってものがあるのよ！！" },
      { text: "うん、太った", rate: 0, deathReason: "『怒らないから』を信じる人、初めて見たわ……" } ] },
  { id: "O010", character: "鬼嫁", prompt: "私が出て行ったら、あんたどうするの？",
    options: [
      { text: "追いかける。だから出て行く前に、何が嫌か教えて。直すから", rate: "MAIN", reaction: "……そこまで言うなら、話してあげる", deathReason: "追いかけるって何！？怖いのよ！" },
      { text: "困る。君がいないと何もできないから", rate: 40, reaction: "……ほんと、何もできないものね", deathReason: "家政婦がいなくなるのが困るだけでしょ！" },
      { text: "そんなこと考えたくないよ", rate: 10, reaction: "……考えなさいよ、少しは", deathReason: "考えたくないって、現実から逃げてるだけじゃない！" },
      { text: "実家に帰るの？駅まで送ろうか？", rate: 0, deathReason: "送るな！！引き止めなさいよ！！" } ] },
];
</script>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{--bg:#fff6ef;--ink:#2a1a14;--sub:#7a5a4e;--card:#fff;--line:#f0d9cc;--red:#e8262b;--red2:#ff5a4e;--ok:#18a058;--gold:#f5a623;--hell:#1a0508}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:"Hiragino Kaku Gothic ProN","Hiragino Sans","Noto Sans JP","Yu Gothic UI",Meiryo,sans-serif;line-height:1.5;touch-action:manipulation;overflow-x:hidden}
body.hell{--bg:#1a0508;--ink:#ffe9e4;--sub:#d79a8f;--card:#2c0d10;--line:#5a1c20}
#app{max-width:520px;margin:0 auto;min-height:100%;padding:12px 16px 72px;position:relative}
.screen{display:none}.screen.on{display:block}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;touch-action:manipulation}
a{color:inherit}
/* title */
.logo{text-align:center;padding:18px 0 6px}
.logo h1{font-size:44px;font-weight:900;letter-spacing:.02em;color:var(--red);text-shadow:3px 3px 0 #2a1a14;line-height:1.1}
.logo .tag{display:inline-block;margin-top:8px;background:#2a1a14;color:#fff;font-size:12px;font-weight:700;padding:3px 10px;border-radius:99px}
.concept{font-size:15px;font-weight:800;text-align:center;margin:12px 0 6px}
.catch{font-size:12.5px;color:var(--sub);background:var(--card);border:2px dashed var(--line);border-radius:12px;padding:10px 12px;margin-bottom:14px}
.diff{display:flex;align-items:center;gap:12px;width:100%;background:var(--card);border:3px solid #2a1a14;border-radius:16px;padding:10px 12px;margin-bottom:10px;box-shadow:0 4px 0 #2a1a14;text-align:left}
.diff:active{transform:translateY(3px);box-shadow:0 1px 0 #2a1a14}
.diff svg{width:62px;height:62px;flex:none}
.diff .lv{font-size:12px;font-weight:900;padding:1px 8px;border-radius:6px;color:#fff;display:inline-block}
.diff b{display:block;font-size:16px}
.diff small{color:var(--sub);font-size:11.5px}
.lv.e{background:#18a058}.lv.n{background:#f08a00}.lv.h{background:var(--red)}
.best{font-size:11.5px;color:var(--sub);text-align:center;margin-top:4px}
/* game */
.hud{display:flex;justify-content:space-between;align-items:center;font-size:12px;font-weight:800;margin-bottom:8px;gap:8px}
.hud .stage{background:#2a1a14;color:#fff;padding:3px 10px;border-radius:99px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
body.hell .hud .stage{background:var(--red)}
.hud .qn{font-size:20px;font-weight:900;white-space:nowrap}
.prog{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-bottom:10px}
.prog i{display:block;height:100%;background:var(--red);width:0}
.scene{display:flex;gap:10px;align-items:flex-start}
.face{width:104px;height:104px;flex:none;border-radius:16px;background:var(--card);border:3px solid #2a1a14}
.face svg{width:100%;height:100%;display:block}
.bubble{flex:1;background:var(--card);border:3px solid #2a1a14;border-radius:16px;padding:10px 12px;font-size:16.5px;font-weight:800;position:relative;min-height:104px;display:flex;align-items:center}
.bubble:before{content:"";position:absolute;left:-12px;top:30px;border:8px solid transparent;border-right:10px solid #2a1a14}
.who{font-size:11px;color:var(--sub);font-weight:700;margin:6px 0 2px}
.mood{font-size:11.5px;color:var(--sub);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:5px 10px;margin:8px 0 12px}
.mood b{color:var(--red)}
.opts{display:grid;gap:9px}
.opt{display:flex;gap:10px;align-items:center;width:100%;text-align:left;background:var(--card);border:3px solid #2a1a14;border-radius:14px;padding:12px;font-size:15px;font-weight:700;box-shadow:0 4px 0 #2a1a14;min-height:56px}
.opt:active{transform:translateY(3px);box-shadow:0 1px 0 #2a1a14}
.opt .k{flex:none;width:28px;height:28px;border-radius:8px;background:#2a1a14;color:#fff;display:grid;place-items:center;font-weight:900;font-size:14px}
body.hell .opt .k{background:var(--red)}
.toast{position:fixed;left:50%;top:14px;transform:translateX(-50%);background:var(--ok);color:#fff;font-weight:900;padding:8px 16px;border-radius:99px;font-size:14px;z-index:9;pointer-events:none;opacity:0;transition:opacity .15s;white-space:nowrap}
.toast.on{opacity:1}
.hellban{display:none;background:var(--red);color:#fff;text-align:center;font-weight:900;padding:8px;border-radius:12px;margin-bottom:10px;font-size:14px}
.hellban.on{display:block}
/* result */
.boom{border-radius:18px;padding:14px;text-align:center;color:#fff;background:var(--red);border:3px solid #2a1a14;margin-bottom:10px}
.boom.clear{background:var(--ok)}
.boom.ng{background:#000;border-color:var(--red);box-shadow:0 0 0 4px var(--red) inset}
.boom h2{font-size:26px;font-weight:900;line-height:1.2}
.boom.ng h2{color:#ffde00;font-size:28px}
.boom .face{width:110px;height:110px;margin:8px auto;background:#fff}
.boom .roar{font-size:17px;font-weight:900;margin-top:6px;line-height:1.45}
.boom .prob{margin-top:8px;font-size:13px;font-weight:800;background:rgba(0,0,0,.25);border-radius:10px;padding:6px 8px}
.boom .prob em{font-style:normal;font-size:20px;color:#ffde00}
.rec{display:flex;gap:8px;margin-bottom:10px}
.rec div{flex:1;background:var(--card);border:3px solid #2a1a14;border-radius:14px;padding:8px;text-align:center}
.rec small{display:block;font-size:11px;color:var(--sub);font-weight:700}
.rec b{font-size:24px;font-weight:900}
.cause{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:10px 12px;margin-bottom:10px;font-size:13.5px}
.cause .h{font-size:11px;color:var(--sub);font-weight:800}
.cause q{font-weight:800}
.badge{flex:none;display:inline-block;font-size:10.5px;font-weight:900;color:#fff;border-radius:6px;padding:1px 6px;text-align:center}
.r0{background:#000}.r10{background:#9b1c1c}.r40{background:#e07a00}.rMAIN{background:var(--ok)}
.btns{display:grid;gap:8px;margin-bottom:10px}
.big{width:100%;border-radius:14px;padding:14px;font-size:17px;font-weight:900;border:3px solid #2a1a14;box-shadow:0 4px 0 #2a1a14}
.big:active{transform:translateY(3px);box-shadow:0 1px 0 #2a1a14}
.retry{background:var(--red);color:#fff}
.x{background:#000;color:#fff}
.sub{background:var(--card)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.hint{text-align:center;font-size:12px;color:var(--sub);font-weight:700;margin-bottom:10px}
details.zukan{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:10px 12px;margin-bottom:10px;cursor:auto}
details.zukan summary{font-weight:900;font-size:14px;cursor:pointer}
.zk{list-style:none;display:grid;gap:6px;margin-top:8px;max-height:280px;overflow:auto}
.zk li{font-size:12px;border-bottom:1px dashed var(--line);padding-bottom:5px}
.zk li .who2{color:var(--sub);font-size:10.5px}
.zk li.new{background:#fff3b0;border-radius:6px}
body.hell .zk li.new{background:#5a3a00}
/* corner */
.corner{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;gap:6px;flex-wrap:wrap;padding:6px 8px calc(6px + env(safe-area-inset-bottom));background:linear-gradient(transparent,var(--bg) 35%);font-size:11px;font-weight:800;pointer-events:none;z-index:5}
.corner a,.corner span{pointer-events:auto;background:var(--card);border:2px solid #2a1a14;border-radius:99px;padding:3px 10px;text-decoration:none;white-space:nowrap}
.corner a{background:#ffdd57;color:#2a1a14}
/* HOME / モーダル / 実績 */
.home{flex:none;background:var(--card);border:2px solid #2a1a14;border-radius:99px;padding:3px 10px;font-size:12px;font-weight:900;white-space:nowrap}
.home:active{transform:translateY(1px)}
.statsBtn{font-size:14px;padding:10px 6px;line-height:1.35}
.statsBtn small{font-size:11px;color:var(--sub);font-weight:800}
.titleBtns{margin:4px 0 6px}
.zksum{font-size:12px;color:var(--sub);font-weight:700}
.tabs{display:grid;grid-template-columns:repeat(auto-fit,minmax(58px,1fr));gap:6px}
.tab{background:var(--card);border:2px solid #2a1a14;border-radius:10px;padding:5px 2px;font-size:12px;font-weight:900;line-height:1.3}
.tab small{display:block;font-size:10px;color:var(--sub)}
.tab.on{background:#2a1a14;color:#fff}.tab.on small{color:#ddd}
.panel .zk{max-height:none;margin-top:0}
.modal{display:none;position:fixed;inset:0;z-index:20;background:rgba(20,8,6,.6);padding:16px;overflow:auto}
.modal.on{display:flex;align-items:flex-start;justify-content:center}
.panel{width:100%;max-width:520px;margin:auto;background:var(--bg);color:var(--ink);border:3px solid #2a1a14;border-radius:18px;padding:14px;display:grid;gap:12px}
.panel.small{max-width:360px;text-align:center}
.panel .ask{font-size:17px;font-weight:900}
.panel .ask small{font-size:12.5px;color:var(--sub);font-weight:700}
.phead{display:flex;align-items:center;gap:10px}
.phead h2{font-size:18px;font-weight:900}
.sec{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:10px 12px}
.sec h3{font-size:13px;font-weight:900;margin-bottom:6px}
.clr{display:grid;gap:6px}
.clr div{display:flex;align-items:center;gap:8px;font-size:13px}
.clr .lv{flex:none;width:64px;text-align:center;color:#fff;font-size:11px;font-weight:900;border-radius:6px;padding:1px 0}
.hud .stage{min-width:0}
.clr b{margin-left:auto;font-size:12px;font-weight:900;border-radius:6px;padding:1px 8px;white-space:nowrap}
.clr b.ok{background:var(--ok);color:#fff}.clr b.no{background:var(--line);color:var(--sub)}
.nums{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;text-align:center}
.nums div{border:2px solid var(--line);border-radius:10px;padding:6px 2px}
.nums b{display:block;font-size:20px;font-weight:900}
.nums small{font-size:10.5px;color:var(--sub);font-weight:700}
.ach{list-style:none;display:grid;gap:5px}
.ach li{display:flex;gap:8px;align-items:center;font-size:12.5px;opacity:.45}
.ach li.got{opacity:1}
.ach li i{font-style:normal;font-size:18px;width:24px;text-align:center;flex:none}
.ach li span small{display:block;color:var(--sub);font-size:10.5px}
/* 隠しEXステージ：赤黒い背景・警告ランプ・脈打つ枠 */
body.hell{background:radial-gradient(ellipse at 50% 30%,#3a0a0e 0%,#1a0508 55%,#0a0002 100%) fixed}
.lamp{display:none;height:8px;border-radius:4px;margin-bottom:8px;background:repeating-linear-gradient(90deg,#ff1a1a 0 22px,#2a0004 22px 44px);box-shadow:0 0 12px #ff1a1a;animation:lamp .9s steps(2) infinite}
body.hell .lamp{display:block}
@keyframes lamp{50%{background-position:22px 0;opacity:.55}}
body.hell .hellban{background:#000;border:2px solid #ff1a1a;color:#ffde00;animation:pulse 1.4s ease-in-out infinite}
body.hell #game .face{border-color:#ff1a1a;animation:pulse 1.4s ease-in-out infinite}
body.hell #game .bubble,body.hell .opt{border-color:#ff1a1a}
body.hell .opt{box-shadow:0 4px 0 #7a0000}
@keyframes pulse{50%{box-shadow:0 0 18px 4px rgba(255,26,26,.6)}}
/* 結果画面：EX挑戦ボタン・伝説 */
#result.tapretry{cursor:pointer}
#result{cursor:auto}
.big.ex{background:#1a0508;color:#ffde00;border-color:#ff1a1a;box-shadow:0 4px 0 #7a0000;animation:pulse 1.4s ease-in-out infinite}
.big.gold{background:linear-gradient(#ffe680,#f5a623);color:#2a1a14}
.boom.legend{background:linear-gradient(135deg,#fff3b0 0%,#f5c400 45%,#e08e00 100%);color:#2a1a14;border-color:#7a4a00;box-shadow:0 0 0 4px #fff6c8 inset,0 0 24px rgba(245,166,35,.7)}
.boom.legend h2{font-size:30px;margin-top:8px}
.boom.legend .prob{background:rgba(255,255,255,.55);color:#4a2c00}
.goldbadge{display:inline-block;background:linear-gradient(#fffbe0,#ffd93b 50%,#c98a00);color:#4a2c00;border:3px solid #7a4a00;border-radius:99px;padding:6px 18px;font-weight:900;font-size:19px;box-shadow:0 0 0 4px #fff6c8,0 6px 18px rgba(201,138,0,.6);animation:shine 1.6s ease-in-out infinite}
@keyframes shine{50%{transform:scale(1.06);box-shadow:0 0 0 4px #fff6c8,0 0 28px rgba(255,217,59,.95)}}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:30;overflow:hidden}
.confetti i{position:absolute;top:-48px;font-style:normal;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(115vh) rotate(600deg)}}
.goldflash{animation:gf 1s}
@keyframes gf{0%{background:#fff7c2}30%{background:#ffd93b}100%{background:var(--bg)}}
@media (prefers-reduced-motion:reduce){.lamp,body.hell .hellban,body.hell #game .face,.big.ex,.goldbadge{animation:none}.confetti{display:none}}
/* 鬼モード：タイトルのボタン・ロック表示・制覇画面 */
.lv.o{background:#000;color:#ffde00;box-shadow:0 0 0 2px #e8262b}
.diff.oni{background:linear-gradient(135deg,#2c0d10,#1a0508);color:#ffe9e4;border-color:#000}
.diff.oni small{color:#d79a8f}
.diff.locked{opacity:.6;filter:grayscale(.8);border-style:dashed}
.diff .lockico{width:62px;height:62px;flex:none;display:grid;place-items:center;font-size:34px}
.boom.onic{background:linear-gradient(160deg,#000 0%,#3a0a0e 60%,#7a0d0d 100%);color:#ffe9e4;border-color:#ffde00;box-shadow:0 0 0 4px #e8262b inset,0 0 26px rgba(232,38,43,.7)}
.boom.onic h2{font-size:30px;margin-top:8px;color:#ffde00;text-shadow:0 0 12px #e8262b}
.goldbadge.oni{background:linear-gradient(#3a0a0e,#000);color:#ffde00;border-color:#ffde00;box-shadow:0 0 0 4px #e8262b,0 0 22px rgba(255,222,0,.6)}
.oniflash{animation:of 1.1s}
@keyframes of{0%{background:#ff1a1a}35%{background:#ffde00}100%{background:var(--bg)}}
.flash{animation:fl .35s}
.opts.locked .opt{pointer-events:none;opacity:.4;box-shadow:0 4px 0 #2a1a14}
.opts.locked .opt.picked{opacity:1;background:#ffde00;color:#2a1a14;transform:translateY(3px);box-shadow:0 1px 0 #2a1a14}
.bubble.silent{color:var(--sub);font-size:28px;letter-spacing:.2em;justify-content:center}
.face.boomfx{animation:bm .38s;border-color:var(--red);box-shadow:0 0 0 6px rgba(232,38,43,.35)}
@keyframes bm{0%{transform:scale(1.25) rotate(-6deg)}30%{transform:scale(1.1) rotate(5deg)}60%{transform:scale(1.05) rotate(-3deg)}100%{transform:none}}
@keyframes fl{0%{background:#ff0000}100%{background:var(--bg)}}
@media (min-width:600px){.logo h1{font-size:54px}.bubble{font-size:18px}.opt{font-size:16px}}
@media (max-width:360px){.face{width:84px;height:84px}.bubble{min-height:84px;font-size:15px}.logo h1{font-size:36px}}
</style>
</head>
<body>
<div id="app">
  <!-- ===== タイトル ===== -->
  <section id="title" class="screen on">
    <div class="logo"><h1>ヒス回避<br>ゲーム</h1><span class="tag">実践的ヒス回避トレーニング</span></div>
    <p class="concept">いつか訪れる（あるいは日常の）<br>ヒス対面時に備えろ！</p>
    <p class="catch">ヒスを起こす人間（地雷）の機嫌は、時間・気分・血圧・直前の出来事によって<b>秒単位で変化する！</b>昨日までの正解が今日の正解とは限らない……自分の運と直感を研ぎ澄ませ！</p>
    <div id="diffs"></div>
    <div class="row2 titleBtns">
      <button class="big sub statsBtn" id="statsBtn">🏆 実績・<br>クリアステータス</button>
      <button class="big sub statsBtn" id="zkBtn">📖 地雷セリフ図鑑<br><small id="zkTitle"></small></button>
    </div>
  </section>

  <!-- ===== ゲーム ===== -->
  <section id="game" class="screen">
    <div class="lamp" aria-hidden="true"></div>
    <div class="hud"><button class="home" id="gameHome">🏠 HOME</button><span class="stage" id="stage"></span><span class="qn" id="qn"></span></div>
    <div class="prog"><i id="bar"></i></div>
    <div class="hellban" id="hellban"></div>
    <div class="scene">
      <div class="face" id="face"></div>
      <div class="bubble" id="prompt"></div>
    </div>
    <p class="who" id="who"></p>
    <p class="mood" id="mood"></p>
    <div class="opts" id="opts"></div>
  </section>

  <!-- ===== リザルト ===== -->
  <section id="result" class="screen">
    <div class="hud"><button class="home" data-act="title">🏠 HOME</button></div>
    <div class="boom" id="boom"></div>
    <p class="hint" id="retryHint">▶ 画面タップ / Enter で即リトライ</p>
    <div class="rec"><div><small>今回の記録</small><b id="recNow"></b></div><div><small>自己ベスト</small><b id="recBest"></b></div></div>
    <div class="cause" id="cause"></div>
    <div class="btns">
      <button class="big ex" data-act="ex" id="exBtn">🔥 隠しEXステージ（8〜10問）に挑む</button>
      <button class="big retry" data-act="retry">⚡ 即リトライ（1問目から）</button>
      <button class="big x" data-act="share" id="shareBtn">𝕏 記録をポストする</button>
      <div class="row2"><button class="big sub" data-act="title">🏠 HOME</button><button class="big sub" data-act="next" id="nextBtn">次の難易度へ</button></div>
    </div>
    <details class="zukan" id="zukanBox"><summary id="zkSum"></summary><ul class="zk" id="zkList"></ul></details>
  </section>
</div>

<!-- ===== 実績・クリアステータス ===== -->
<div class="modal" id="statsModal" role="dialog" aria-modal="true" aria-labelledby="statsTitle">
  <div class="panel">
    <div class="phead"><button class="home" data-close>🏠 HOME</button><h2 id="statsTitle">🏆 実績・クリアステータス</h2></div>
    <div id="statsBody"></div>
    <button class="big sub" data-close>✕ 閉じる</button>
  </div>
</div>

<!-- ===== 地雷セリフ図鑑 ===== -->
<div class="modal" id="zukanModal" role="dialog" aria-modal="true" aria-labelledby="zkModalTitle">
  <div class="panel">
    <div class="phead"><button class="home" data-close>🏠 HOME</button><h2 id="zkModalTitle">📖 地雷セリフ図鑑</h2></div>
    <p class="zksum" id="zkModalSum"></p>
    <div class="tabs" id="zkTabs"></div>
    <div class="sec"><ul class="zk" id="zkModalList"></ul></div>
    <button class="big sub" data-close>✕ 閉じる</button>
  </div>
</div>

<!-- ===== プレイ中にHOMEを押した時の確認 ===== -->
<div class="modal" id="homeModal" role="dialog" aria-modal="true">
  <div class="panel small">
    <p class="ask">タイトルに戻りますか？<br><small>進行状況はリセットされます</small></p>
    <div class="row2"><button class="big sub" id="homeNo">続ける</button><button class="big retry" id="homeYes">🏠 戻る</button></div>
  </div>
</div>

<div class="toast" id="toast"></div>
<div class="corner">
  <a id="coffee" target="_blank" rel="noopener">開発者にコーヒーを奢る☕</a>
  <span>配信・動画利用大歓迎！商用利用OK</span>
</div>

<script>
/* =====================================================================
 *  設定
 * ===================================================================== */
const CONFIG = {
  COFFEE_URL: "https://buymeacoffee.com/red_freegames",   // 投げ銭ページ

  EX_LINES: ["⚠ ここからは真の理不尽……正解でもキレられる確率が跳ね上がる", "⚠ 生存率数%の極限地帯。息をするのも慎重に", "⚠ 最終問題。伝説まで、あと1問"],

const MODES = {

  NORMAL: { char: "彼女",       goal: 7, rates: { MAIN: 93,  40: 30, 10: 10, 0: 0 }, label: "NORMAL", cls: "n", title: "メンヘラ気味の彼女", hint: "文脈を読めば回避できる。……ただし、ごくまれに" },

            hint: "1問目から悪魔化。正解でも3回に1回はキレられる", locked: "HARDクリアで解放",
            unlocked: s => (s.clears.HARD || 0) > 0 || s.legend > 0,

};
const CHARS = {

                  moods: ["朝の電車で足を踏まれた", "競馬で大穴を外した直後", "駐車場が満車だった", "コーヒーがぬるかった", "妻に小言を言われて出てきた"] },
  "彼女":       {
                  moods: ["前髪が決まらなかった", "友達の惚気話を聞いた直後", "生理前", "インスタのいいねが少なかった", "推しが熱愛報道された"] },
  "母親":       {
                  moods: ["PTAの会合帰り", "体重計に乗った直後", "ワイドショーで嫌なニュースを見た", "特売の卵が売り切れだった", "お父さんが靴下を脱ぎっぱなし"] },
  "鬼嫁":       {
                  moods: ["夫の母親から電話があった", "結婚式の写真を見返していた", "夫の靴下が裏返しで洗濯機に入っていた", "ママ友のSNSを見た直後", "3日前のことをまだ思い出している"] },
};
// 選んだ選択肢の「正体」（数値は一切出さず、言葉だけで明かす）
const VERDICT = {
  MAIN: { tag: "実は正解", note: "✅ 実はそれ【正解】でした。……でもキレられた。（理不尽）" },
  40:   { tag: "悪くない", note: "🤔 悪くはなかった。でも今日の機嫌には合わなかった。" },
  10:   { tag: "危険",     note: "⚠ かなり危ない橋を渡っていた。" },
  0:    { tag: "絶対NG",   note: "⚠ これは次から絶対に選んではいけない地雷！" },
};
const COMMON_MOODS = ["低気圧で頭痛", "血圧が秒単位で乱高下中", "空腹", "寝不足", "なぜか今日は機嫌がいい（危険）", "さっきまで笑っていた（危険）"];
const LS = { best: "hisu_best_v1", zukan: "hisu_zukan_v1", stats: "hisu_stats_v1" };

/* =====================================================================
 *  ユーティリティ
 * ===================================================================== */
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const rnum = r => (r === "MAIN" ? 100 : r);   // 並べ替え用（本命を最上位扱い）
const pick = a => a[(Math.random() * a.length) | 0];
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = (Math.random() * (i + 1)) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; };
const load = (k, d) => { try { return JSON.parse(localStorage.getItem(k)) || d; } catch (e) { return d; } };
const save = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };
// プレイデータ（ローカル保存）
const loadStats = () => Object.assign({ plays: 0, survived: 0, deaths: 0, mainDeaths: 0, ngDeaths: 0, escapeDeaths: 0, exTries: 0, legend: 0, clears: {} }, load(LS.stats, {}));
const bumpStats = fn => { const s = loadStats(); fn(s); save(LS.stats, s); };

/* ===== 表情イラスト（静止画切り替えのみ）=====

const FACE = {

    eyes: '<path d="M37 52 L51 54 M83 52 L69 54" stroke="#2a1a14" stroke-width="4" stroke-linecap="round"/><circle cx="45" cy="62" r="4"/><circle cx="75" cy="62" r="4"/>',

    mouth: '<path d="M50 83 Q60 88 70 83" fill="none" stroke="#2a1a14" stroke-width="4" stroke-linecap="round"/>',

};
// demon=true で隠しEXステージ用の「悪魔化・般若顔」（赤黒い肌・角・光る目・牙・稲妻）

  const f = FACE[key];
  let skin = f.skin, eyes = f.eyes, mouth = f.mouth, vein = f.fx;

  } else if (ch === "彼女") {
    back = '<path d="M18 60 Q14 16 60 14 Q106 16 102 60 L106 110 L84 110 L84 60 L36 60 L36 110 L14 110Z" fill="#8a4b3a"/>';
    front = '<path d="M26 50 Q30 18 60 18 Q90 18 94 50 Q80 34 62 40 Q48 30 26 50Z" fill="#8a4b3a"/><path d="M78 18 l14 -8 l2 14 Z M78 18 l-2 -14 l14 8Z" fill="#ff6fa8"/><circle cx="36" cy="74" r="6" fill="#ff9aa8" opacity=".6"/><circle cx="84" cy="74" r="6" fill="#ff9aa8" opacity=".6"/>';
  } else if (ch === "鬼嫁") {
    back = '<path d="M16 62 Q12 14 60 12 Q108 14 104 62 L108 118 L86 118 L86 60 L34 60 L34 118 L12 118Z" fill="#15090a"/>';
    front = '<path d="M24 52 Q26 16 60 16 Q94 16 96 52 Q92 30 74 28 L60 40 L46 28 Q28 30 24 52Z" fill="#15090a"/><path d="M84 22 l10 -4 l-2 10Z" fill="#e8262b"/><path d="M42 106 Q60 116 78 106 L82 124 L38 124Z" fill="#7a0d0d"/>';
  } else {
    back = '<circle cx="60" cy="14" r="13" fill="#5a3a2e"/>';
    front = '<path d="M24 52 Q22 22 60 22 Q98 22 96 52 Q88 36 60 34 Q32 36 24 52Z" fill="#5a3a2e"/><g fill="none" stroke="#2a1a14" stroke-width="3"><circle cx="45" cy="62" r="10"/><circle cx="75" cy="62" r="10"/><path d="M55 62 L65 62"/></g><path d="M40 104 Q60 114 80 104 L84 124 L36 124Z" fill="#f4a3b5"/>';
  }
  const horns = demon ? '<path d="M32 34 Q20 18 24 2 Q36 16 46 26Z M88 34 Q100 18 96 2 Q84 16 74 26Z" fill="#f3e6c8" stroke="#2a1a14" stroke-width="2.5"/>' : "";
  return `<svg viewBox="0 0 120 124" xmlns="http://www.w3.org/2000/svg">${back}<ellipse cx="60" cy="62" rx="38" ry="42" fill="${skin}" stroke="#2a1a14" stroke-width="3"/>${eyes}${mouth}${front}${horns}${vein}</svg>`;
}

/* =====================================================================
 *  ゲーム状態
 * ===================================================================== */
const S = { run: 0, mode: null, q: 0, deck: [], cur: null, shown: [], endless: false, lock: false, last: null, resultAt: 0 };
const POOL = {};
CONST_QUESTIONS.forEach(q => (POOL[q.character] = POOL[q.character] || []).push(q));
let toastTimer;

function show(id) {
  document.querySelectorAll(".screen").forEach(s => s.classList.toggle("on", s.id === id));
  window.scrollTo(0, 0);
}

function renderTitle() {
  S.run++;
  closeModals();
  const best = load(LS.best, {});
  $("diffs").innerHTML = Object.entries(MODES).map(([k, m]) => isUnlocked(k) ? `
    <button class="diff${m.demon ? " oni" : ""}" data-mode="${k}">${faceSVG(m.char, false, m.demon)}
      <div><span class="lv ${m.cls}">${m.label}</span><b>${m.title}</b>
      <small>${m.goal}問連続クリアで訓練完了${m.endless ? "／突破で隠しEXステージ…？" : ""}<br>${m.hint}<br>自己ベスト：${best[k] ? best[k] + "問目" : "—"}${m.demon && oniTitle() ? `／称号『${oniTitle().name}』` : ""}</small></div></button>` : `
    <button class="diff locked" data-mode="${k}"><span class="lockico">🔒</span>
      <div><span class="lv ${m.cls}">${m.label}</span><b>？？？</b><small>${m.locked}</small></div></button>`).join("");
  const z = load(LS.zukan, {});
  $("zkTitle").textContent = `${Object.keys(z).length} / ${CONST_QUESTIONS.length * 4} 解除`;
  document.body.classList.remove("hell");
  show("title");
}

// 悪魔化グラフィック・ダークUIを使う状態か（HARDの隠しEXステージ中、または demon モード＝鬼モード）
const demonOn = () => S.endless || !!(MODES[S.mode] && MODES[S.mode].demon);
const isUnlocked = k => !MODES[k].unlocked || MODES[k].unlocked(loadStats());

function start(mode) {
  if (!isUnlocked(mode)) return toast(`🔒 ${MODES[mode].locked}`);
  S.run++; S.mode = mode; S.q = 1; S.endless = false; S.lock = false; S.deck = [];
  closeModals();
  bumpStats(s => { s.plays++; });
  document.body.classList.toggle("hell", demonOn());
  $("hellban").classList.toggle("on", demonOn());
  next();
  show("game");
}

// HARDクリア後、任意で挑む隠しEXステージ（goal+1 〜 EX_GOAL 問目）
function startEX() {
  S.run++; S.endless = true; S.q = MODES[S.mode].goal + 1; S.lock = false;
  closeModals();
  bumpStats(s => { s.exTries++; });
  document.body.classList.add("hell");
  $("hellban").classList.add("on");
  next();
  show("game");
}

// 正解（MAIN）の現在の生存率
function mainRate() {
  if (!S.endless) return MODES[S.mode].rates.MAIN;
  return CONFIG.EX_RATES[Math.min(S.q - MODES[S.mode].goal - 1, CONFIG.EX_RATES.length - 1)];
}

function next() {
  const m = MODES[S.mode];
  if (!S.deck.length) S.deck = shuffle(POOL[m.char]).filter(q => q !== S.cur);   // EXでも同じ相手の未出題から続けて出す
  const q = S.cur = S.deck.pop();
  S.shown = shuffle(q.options.map((o, i) => ({ ...o, idx: i })));
  const exN = CONFIG.EX_GOAL - m.goal, exI = S.q - m.goal - 1;
  $("stage").textContent = S.endless ? "🔥 隠しEXステージ" : m.demon ? `👹 ${m.label}：${m.title}` : `${m.label}：${m.title}`;
  $("qn").textContent = S.endless ? `${S.q} / ${CONFIG.EX_GOAL}` : `${S.q} / ${m.goal}`;
  $("bar").style.width = (S.endless ? exI / exN : (S.q - 1) / m.goal) * 100 + "%";
  if (S.endless) $("hellban").textContent = CONFIG.EX_LINES[Math.min(exI, CONFIG.EX_LINES.length - 1)];
  else if (m.demon) $("hellban").textContent = m.lines[Math.min(S.q - 1, m.lines.length - 1)];
  $("face").innerHTML = faceSVG(q.character, "normal", demonOn());
  $("face").classList.remove("boomfx");
  $("opts").classList.remove("locked");
  document.body.classList.remove("flash");
  $("prompt").textContent = q.prompt;
  $("who").textContent = "▲ " + (m.demon ? `${m.title} 👿⚡` : demonOn() ? `悪魔化した${q.character} 👿⚡` : m.title);
  const bp = 120 + ((Math.random() * 80) | 0);
  $("mood").innerHTML = `現在の機嫌：<b>血圧${bp}</b>／直前の出来事：${esc(pick(CHARS[q.character].moods.concat(COMMON_MOODS)))}`;
  $("opts").innerHTML = S.shown.map((o, i) => `<button class="opt" data-i="${i}"><span class="k">${"ABCD"[i]}</span><span>${esc(o.text)}</span></button>`).join("");
  S.lock = false;
}

// run が変わったら（リトライ・タイトル復帰）待機中のタイマーは無効
const later = (ms, fn) => { const run = S.run; setTimeout(() => { if (run === S.run) fn(); }, ms); };

function choose(i) {
  if (S.lock || !S.shown[i]) return;
  S.lock = true;
  const o = S.shown[i], ch = S.cur.character;
  // 1) 選択中表示＋全ロック → 2) 相手が黙り込む（タメ）
  $("opts").classList.add("locked");
  $("opts").children[i].classList.add("picked");
  $("face").innerHTML = faceSVG(ch, "silent", demonOn());
  $("prompt").textContent = "……";
  $("prompt").classList.add("silent");
  // 3) タメの後に確率判定
  later(CONFIG.TAME_MS, () => {
    const rate = o.rate === "MAIN" ? mainRate() : MODES[S.mode].rates[o.rate];
    const survive = Math.random() * 100 < rate;   // ← 確率判定
    $("prompt").classList.remove("silent");
    if (!survive) {
      $("face").innerHTML = faceSVG(ch, "angry", demonOn());
      $("prompt").textContent = o.deathReason;      // この選択肢専用のキレ理由
      $("face").classList.add("boomfx");
      document.body.classList.add("flash");
      return later(CONFIG.BOOM_MS, () => die(o));
    }
    $("face").innerHTML = faceSVG(ch, "relief", demonOn());
    $("prompt").textContent = o.reaction || "……";  // この選択肢専用の返答
    toast("回避成功！");
    bumpStats(s => { s.survived++; });
    later(CONFIG.REACT_MS, advance);
  });
}

function advance() {
  S.q++;
  const m = MODES[S.mode];
  if (!S.endless && S.q > m.goal) return finish(true);                 // 各モードのクリア（HARDはここでEXへの挑戦権）
  if (S.endless && S.q > CONFIG.EX_GOAL) return finish(true, true);    // EX最終問突破＝伝説
  next();
}

function die(o) {
  const q = S.cur;
  S.last = { q, o, reason: o.deathReason, reached: S.q, endless: S.endless, demon: demonOn(), clear: false };
  bumpStats(s => {
    s.deaths++;
    if (o.rate === "MAIN") s.mainDeaths++;
    if (o.rate === 0) s.ngDeaths++;
    if (o.deathReason === ESCAPE_NG) s.escapeDeaths++;
  });
  // 図鑑登録
  const z = load(LS.zukan, {}), key = q.id + ":" + o.idx;
  S.last.isNew = !z[key];
  z[key] = (z[key] || 0) + 1; save(LS.zukan, z);
  finish(false);
}

function finish(clear, legend) {
  const m = MODES[S.mode];
  if (clear) {
    const firstHard = S.mode === "HARD" && !legend && !(loadStats().clears.HARD > 0);
    S.last = { clear: true, legend: !!legend, reached: legend ? CONFIG.EX_GOAL : m.goal, endless: !!legend,
               exReady: !legend && !!m.endless,      // HARDクリア直後はEXへの挑戦ボタンを出す
               oni: !!m.demon, firstHard };
    bumpStats(s => { if (legend) s.legend++; else s.clears[S.mode] = (s.clears[S.mode] || 0) + 1; });
    if (m.demon) { S.last.title = oniTitle(); S.last.nextTitle = oniNextTitle(); S.last.newTitle = S.last.title && loadStats().clears.ONI === S.last.title.n; }
  }
  const best = load(LS.best, {});
  const isBest = S.last.reached > (best[S.mode] || 0);
  if (isBest) { best[S.mode] = S.last.reached; save(LS.best, best); }
  if (clear) document.body.classList.remove("hell");
  renderResult(isBest);
  S.resultAt = Date.now();
  show("result");
  if (legend) celebrate();
  if (clear && m.demon) celebrate(["👹", "🔥", "⚡", "👑", "💀", "✨", "🏆"], "oniflash");
}

// 鬼モードの称号（クリア回数で昇格）。ここに足せば称号を増やせる
const ONI_TITLES = [
  { n: 1, name: "鬼神回避",       desc: "鬼モードを初クリア" },
  { n: 3, name: "修羅の交際者",   desc: "鬼モードを3回クリア" },
  { n: 5, name: "理不尽の支配者", desc: "鬼モードを5回クリア" },
];
const oniTitle = () => { const c = loadStats().clears.ONI || 0; return ONI_TITLES.filter(t => c >= t.n).pop() || null; };
const oniNextTitle = () => { const c = loadStats().clears.ONI || 0; const t = ONI_TITLES.find(t => c < t.n); return t ? { ...t, left: t.n - c } : null; };

// 伝説・鬼モード制覇：フラッシュ＋紙吹雪（軽量なDOM絵文字。数秒で自動で消える）
function celebrate(pieces = ["🎉", "🎊", "👑", "✨", "🏆", "💛", "⭐"], flash = "goldflash") {
  ["goldflash", "oniflash"].forEach(c => document.body.classList.remove(c)); void document.body.offsetWidth; document.body.classList.add(flash);
  const box = document.createElement("div");
  box.className = "confetti";
  for (let i = 0; i < 60; i++) {
    const p = document.createElement("i");
    p.textContent = pieces[i % pieces.length];
    p.style.left = Math.random() * 100 + "%";
    p.style.fontSize = 16 + Math.random() * 18 + "px";
    p.style.animationDuration = 2.2 + Math.random() * 2 + "s";
    p.style.animationDelay = Math.random() * 1.2 + "s";
    box.appendChild(p);
  }
  document.body.appendChild(box);
  setTimeout(() => box.remove(), 5000);
}

function renderResult(isBest) {
  const L = S.last, m = MODES[S.mode];
  const char = L.clear ? m.char : L.q.character;
  if (L.legend) {
    $("boom").className = "boom legend";
    $("boom").innerHTML = `<div class="goldbadge">👑 伝説のヒス回避マスター</div>
      <h2>${CONFIG.EX_GOAL}問完全制覇！</h2><div class="face">${faceSVG(char, "relief")}</div>
      <div class="roar">生存率約3.6%の奇跡を達成！</div>
      <div class="prob">あなたは理不尽の頂点を極めました。</div>`;
  } else if (L.oni) {
    $("boom").className = "boom onic";
    $("boom").innerHTML = `<div class="goldbadge oni">👹 称号『${esc(L.title.name)}』${L.newTitle ? " 獲得！" : ""}</div>
      <h2>鬼モード制覇！</h2><div class="face">${faceSVG(char, "relief", true)}</div>
      <div class="roar">${esc(m.title)}の理不尽${m.goal}問を、すべて回避した。</div>
      <div class="prob">正解ですらキレられる地獄を越えた者だけが、この称号を名乗れる。</div>`;
  } else if (L.exReady) {
    $("boom").className = "boom clear";
    $("boom").innerHTML = `<h2>🎉 ${m.label}モード クリア！</h2><div class="face">${faceSVG(char, false)}</div>
      <div class="roar">${m.title}を${m.goal}問連続で回避した！</div>
      <div class="prob">……だが、その先に「裏」がある。挑むかどうかは、あなた次第。</div>`;
  } else if (L.clear) {
    $("boom").className = "boom clear";
    $("boom").innerHTML = `<h2>🎉 訓練完了！</h2><div class="face">${faceSVG(char, false)}</div>
      <div class="roar">${m.title}を${m.goal}問連続で回避した！</div>
      <div class="prob">その判断力は本物だ。だが明日の機嫌は誰にも読めない……</div>`;
  } else {
    const ng = L.o.rate === 0, main = L.o.rate === "MAIN", escape = L.reason === ESCAPE_NG;
    $("boom").className = "boom" + (ng ? " ng" : "");
    $("boom").innerHTML = `<h2>${escape ? "【絶対NG！】<br>うやむやに逃げた！" : ng ? "【絶対NG！】<br>ありえない選択肢！" : main ? "💥 正解なのに爆死！" : "💥 爆死！"}</h2>
      <div class="face">${faceSVG(char, "angry", L.demon)}</div>
      <div class="roar">「${esc(L.reason)}」</div>
      <div class="prob">${VERDICT[L.o.rate].note}</div>`;
  }
  const best = load(LS.best, {});
  $("recNow").textContent = L.legend ? "完全制覇" : `${L.reached}問目`;
  $("recBest").innerHTML = `${best[S.mode] || 0}問目${isBest ? ' <small style="color:var(--red)">NEW!</small>' : ""}`;

  if (L.legend) {
    $("cause").innerHTML = `<div class="h">👑 結果</div>${esc(m.title)}を${m.goal}問、さらに悪魔化した${esc(m.char)}を${CONFIG.EX_GOAL - m.goal}問、すべて回避した。この記録は誇っていい。`;
  } else if (L.oni) {
    $("cause").innerHTML = `<div class="h">👹 結果</div>鬼モード通算${loadStats().clears.ONI}回目の制覇。` +
      (L.nextTitle ? `<br>あと${L.nextTitle.left}回の制覇で、称号『${esc(L.nextTitle.name)}』に昇格。` : "<br>すべての鬼の称号を手にした。あなたこそ理不尽の頂点。");
  } else if (L.exReady) {
    $("cause").innerHTML = `<div class="h">🏆 結果</div>${esc(m.title)}の訓練を完了！<br>🔥 隠しEXステージ：正解でもキレられる確率がさらに上がる、真の理不尽が待っている。` +
      (L.firstHard ? "<br><b>👹 新モード「鬼モード」が解放されました！</b>" : "");
  } else if (L.clear) {
    $("cause").innerHTML = `<div class="h">🏆 結果</div>${esc(m.title)}の訓練を完了！次はさらに理不尽な相手が待っている……`;
  } else {
    $("cause").innerHTML = `<div class="h">💀 敗因（${L.endless ? "隠しEXステージ・" : MODES[S.mode].demon ? "鬼モード・" : ""}${L.reached}問目）</div>
      vs ${esc(L.q.character)}「${esc(L.q.prompt)}」<br>
      あなた：<q>${esc(L.o.text)}</q><br>→ キレ理由：「${esc(L.reason)}」`;
  }
  const order = Object.keys(MODES), nextMode = order[order.indexOf(S.mode) + 1];
  const showNext = nextMode && isUnlocked(nextMode);
  $("nextBtn").style.display = showNext ? "" : "none";
  $("nextBtn").textContent = showNext ? (MODES[nextMode].demon ? "👹 " : "") + MODES[nextMode].label + "へ" : "";
  $("nextBtn").dataset.mode = nextMode || "";
  $("exBtn").style.display = L.exReady ? "" : "none";
  const special = L.legend || L.oni;                         // 伝説・鬼モード制覇は記念ポストを金色で一番上に
  $("shareBtn").className = "big " + (special ? "gold" : "x");
  $("shareBtn").style.order = special ? -1 : 0;
  $("shareBtn").textContent = L.legend ? `🏆 ${CONFIG.EX_GOAL}問完全制覇記念ポスト（X共有）` : L.oni ? `👹 鬼モード制覇＆称号『${L.title.name}』をポスト` : "𝕏 記録をポストする";
  // HARDクリア直後・伝説達成・鬼モード制覇は、誤タップで挑戦権・余韻を失わないよう「どこでもタップでリトライ」を止める
  const tapRetry = !(L.exReady || special);
  $("result").classList.toggle("tapretry", tapRetry);
  $("retryHint").textContent = tapRetry ? "▶ 画面タップ / Enter で即リトライ" : "▼ ボタンを選んでください";
  renderZukan(L.clear ? null : L.q.id + ":" + L.o.idx);
}

// 図鑑の項目一覧（ch を渡すとそのキャラだけ）。newKey は直前に踏んだ地雷（先頭に出して NEW 表示）
function zukanItems(ch, newKey) {
  const z = load(LS.zukan, {}), items = [];
  CONST_QUESTIONS.forEach(q => { if (!ch || q.character === ch) q.options.forEach((o, i) => { const k = q.id + ":" + i; if (z[k]) items.push({ q, o, i, k, n: z[k] }); }); });
  items.sort((a, b) => (b.k === newKey) - (a.k === newKey) || rnum(a.o.rate) - rnum(b.o.rate));
  return items;
}
function zukanHTML(items, newKey) {
  return items.length ? items.map(x => `<li class="${x.k === newKey ? "new" : ""}">
      <span class="badge r${x.o.rate}">${VERDICT[x.o.rate].tag}</span> <b>${esc(x.o.text)}</b>${x.k === newKey && S.last && S.last.isNew ? ' <b style="color:var(--red)">NEW</b>' : ""}<br>
      <span class="who2">vs ${esc(x.q.character)}「${esc(x.q.prompt)}」 ／ キレ理由：「${esc(x.o.deathReason)}」 ／ 被弾${x.n}回</span></li>`).join("")
    : "<li>まだ地雷を踏んでいない……</li>";
}
function renderZukan(newKey) {
  const items = zukanItems(null, newKey);
  $("zkSum").textContent = `📖 解除した地雷セリフ図鑑（${items.length} / ${CONST_QUESTIONS.length * 4}）`;
  $("zkList").innerHTML = zukanHTML(items, newKey);
}
// タイトルから開く図鑑（キャラ別タブ）
function openZukan(ch) {
  const all = zukanItems(null), items = ch ? zukanItems(ch) : all;
  const tabs = [["", "全員"], ...Object.values(MODES).map(m => [m.char, m.char])];
  $("zkModalSum").textContent = `解除：${all.length} / ${CONST_QUESTIONS.length * 4}（踏んだ地雷だけが載ります）`;
  $("zkTabs").innerHTML = tabs.map(([v, label]) => {
    const n = v ? zukanItems(v).length : all.length, max = (v ? POOL[v].length : CONST_QUESTIONS.length) * 4;
    return `<button class="tab${(ch || "") === v ? " on" : ""}" data-ch="${v}">${label}<small>${n}/${max}</small></button>`;
  }).join("");
  $("zkModalList").innerHTML = zukanHTML(items, null);
  openModal("zukanModal");
}

function share() {
  const L = S.last;
  const build = r => {
    if (L.oni) return `【ヒス回避ゲーム】👹鬼モード制覇！！称号『${L.title.name}』獲得！\n` +
      `容赦なき鬼嫁の理不尽${MODES[S.mode].goal}問を完全回避した。\n` +
      `正解ですら3回に1回キレられる地獄、あなたは越えられるか？\n#ヒス回避ゲーム #鬼モード #${L.title.name} ${CONFIG.SHARE_URL}`;
    if (L.legend) return `【ヒス回避ゲーム】👑伝説のヒス回避マスター達成！！\n` +
      `理不尽ヒス${CONFIG.EX_GOAL}問を完全制覇。生存率約3.6%の奇跡を起こした！\n` +
      `あなたは理不尽の頂点を極められるか？\n#ヒス回避ゲーム #対ヒス訓練 #伝説のヒス回避マスター ${CONFIG.SHARE_URL}`;
    let cause;
    if (L.clear) cause = `敗因なし！${MODES[S.mode].title}の訓練を完了`;
    else if (L.o.rate === 0) cause = `絶対NG「${L.o.text}」を選んで即爆死（学習不足）`;
    else if (L.o.rate === "MAIN") cause = `正解を選んだのに「${r}」とキレられた（理不尽）`;
    else cause = `「${r}」とキレられて爆死`;
    return `【ヒス回避ゲーム】対ヒス訓練で『${L.reached}問目』まで生き残った！！\n` +
      `👉 記録：【${L.reached}問目】到達${L.endless ? "（隠しEXステージ突入！）" : `（${MODES[S.mode].label}）`}\n` +
      `💀 最後の敗因：『${cause}』\n${CONFIG.HASHTAGS} ${CONFIG.SHARE_URL}`;
  };
  // Xの文字数上限（全角2・URL23換算で280）に収まるよう、キレ理由だけを末尾から詰める
  const weight = t => [...t.replace(CONFIG.SHARE_URL, "")].reduce((a, c) => a + (c.charCodeAt(0) > 0x10ff ? 2 : 1), 0) + 23;
  let r = L.reason || "", text = build(r);
  while (weight(text) > 280 && r.length > 4) { r = r.slice(0, -2); text = build(r + "…"); }
  window.open("https://twitter.com/intent/tweet?text=" + encodeURIComponent(text), "_blank", "noopener");
}

function toast(msg) {
  const t = $("toast"); t.textContent = msg; t.classList.add("on");
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove("on"), 700);
}

/* =====================================================================
 *  実績・クリアステータス
 *  （ACHIEVEMENTS に1行足すだけで実績を増やせる。ok は s=プレイデータ, b=ベスト記録, zr=図鑑解除率 から判定）
 * ===================================================================== */
const ACHIEVEMENTS = [
  { icon: "🌱", name: "初回避",             desc: "1問回避する",                              ok: (s) => s.survived >= 1 },
  { icon: "🧾", name: "クレーマー撃退",     desc: "EASYをクリア",                             ok: (s) => (s.clears.EASY || 0) > 0 },
  { icon: "💔", name: "彼女の機嫌マスター", desc: "NORMALをクリア",                           ok: (s) => (s.clears.NORMAL || 0) > 0 },
  { icon: "👩", name: "母の壁を越えし者",   desc: "HARDをクリア",                             ok: (s) => (s.clears.HARD || 0) > 0 },
  { icon: "🔥", name: "裏ステージの扉",     desc: "HARDをクリアして隠しEXステージに挑む",  ok: (s) => s.exTries >= 1 },
  { icon: "👹", name: "地獄の底を見た",     desc: "隠しEXステージの最終問（10問目）に到達", ok: (s, b) => (b.HARD || 0) >= 10 },
  { icon: "👑", name: "伝説のヒス回避マスター", desc: "隠しEXステージまで10問完全制覇",       ok: (s) => s.legend >= 1 },
  { icon: "🗝", name: "鬼の封印を解く",     desc: "鬼モードを解放する（HARDクリア）",        ok: (s) => (s.clears.HARD || 0) > 0 || s.legend > 0 },
  ...ONI_TITLES.map((t, i) => ({ icon: ["👹", "⚔", "😈"][i] || "👹", name: t.name, desc: t.desc, ok: (s) => (s.clears.ONI || 0) >= t.n })),
  { icon: "🤯", name: "理不尽の洗礼",       desc: "正解を選んだのに爆死する",                 ok: (s) => s.mainDeaths >= 1 },
  { icon: "💣", name: "地雷を踏み抜いた",   desc: "絶対NGを選んで爆死する",                   ok: (s) => s.ngDeaths >= 1 },
  { icon: "🏃", name: "逃げは許されない",   desc: "「確認してまいります」で爆死する",         ok: (s) => s.escapeDeaths >= 1 },
  { icon: "💯", name: "回避の達人",         desc: "通算100問回避する",                        ok: (s) => s.survived >= 100 },
  { icon: "🔁", name: "百戦錬磨",           desc: "通算100回プレイする",                      ok: (s) => s.plays >= 100 },
  { icon: "📖", name: "図鑑コンプ率25%",    desc: "地雷セリフ図鑑を25%解除",                  ok: (s, b, zr) => zr >= 25 },
  { icon: "📚", name: "図鑑コンプ率50%",    desc: "地雷セリフ図鑑を50%解除",                  ok: (s, b, zr) => zr >= 50 },
  { icon: "👑", name: "地雷博士",           desc: "地雷セリフ図鑑を100%解除",                 ok: (s, b, zr) => zr >= 100 },
];

function renderStats() {
  const s = loadStats(), b = load(LS.best, {}), z = load(LS.zukan, {});
  const total = CONST_QUESTIONS.length * 4, zn = Object.keys(z).length, zr = Math.floor(zn / total * 100);
  const got = ACHIEVEMENTS.filter(a => a.ok(s, b, zr)).length;
  $("statsBody").innerHTML = `
    <div class="sec"><h3>クリア状況</h3><div class="clr">${Object.entries(MODES).map(([k, m]) => {
      const cleared = (s.clears[k] || 0) > 0, open = isUnlocked(k);
      const status = !open ? "🔒 未解放" : m.endless && s.legend ? "👑 完全制覇" : m.demon && oniTitle() ? `👹 ${oniTitle().name}` : cleared ? "CLEAR!" : "未クリア";
      return `<div><span class="lv ${m.cls}">${m.label}</span><span>${open ? esc(m.title) : "？？？"}<br><small>${open ? `ベスト：${b[k] ? b[k] + "問目" : "—"}${m.endless && (b[k] || 0) > m.goal ? "（隠しEXステージ）" : ""}${m.demon ? `／制覇${s.clears[k] || 0}回` : ""}` : esc(m.locked)}</small></span>
        <b class="${cleared && open ? "ok" : "no"}">${status}</b></div>`;
    }).join("")}</div></div>
    <div class="sec"><h3>プレイデータ</h3><div class="nums">
      <div><b>${s.plays}</b><small>プレイ回数</small></div>
      <div><b>${s.survived}</b><small>通算生存問数</small></div>
      <div><b>${s.deaths}</b><small>通算爆死数</small></div>
      <div><b>${s.mainDeaths}</b><small>正解なのに爆死</small></div>
      <div><b>${s.ngDeaths}</b><small>絶対NG被弾</small></div>
      <div><b>${zn}<span style="font-size:12px">/${total}</span></b><small>図鑑解除</small></div>
    </div></div>
    <div class="sec"><h3>実績・称号（${got} / ${ACHIEVEMENTS.length}）</h3><ul class="ach">${ACHIEVEMENTS.map(a => {
      const ok = a.ok(s, b, zr);
      return `<li class="${ok ? "got" : ""}"><i>${ok ? a.icon : "🔒"}</i><span><b>${esc(a.name)}</b><small>${esc(a.desc)}</small></span></li>`;
    }).join("")}</ul></div>`;
}

const openModal = id => $(id).classList.add("on");
function closeModals() { document.querySelectorAll(".modal.on").forEach(m => m.classList.remove("on")); }
function openStats() { renderStats(); openModal("statsModal"); }

/* =====================================================================
 *  入力
 * ===================================================================== */
$("statsBtn").addEventListener("click", openStats);
$("zkBtn").addEventListener("click", () => openZukan(""));
$("zukanModal").addEventListener("click", e => {
  const t = e.target.closest("[data-ch]");
  if (t) return openZukan(t.dataset.ch);
  if (e.target.closest("[data-close]") || e.target.id === "zukanModal") closeModals();
});
$("statsModal").addEventListener("click", e => { if (e.target.closest("[data-close]") || e.target.id === "statsModal") closeModals(); });
$("gameHome").addEventListener("click", () => openModal("homeModal"));    // プレイ中は確認を挟む
$("homeYes").addEventListener("click", renderTitle);
$("homeNo").addEventListener("click", closeModals);
$("homeModal").addEventListener("click", e => { if (e.target.id === "homeModal") closeModals(); });
$("diffs").addEventListener("click", e => { const b = e.target.closest("[data-mode]"); if (b) start(b.dataset.mode); });
$("opts").addEventListener("click", e => { const b = e.target.closest(".opt"); if (b) choose(+b.dataset.i); });
$("result").addEventListener("click", e => {
  if (Date.now() - S.resultAt < 100) return;              // 連打による誤リトライ防止（0.1秒）
  if (e.target.closest("details")) return;
  const b = e.target.closest("[data-act]");
  if (!b && !$("result").classList.contains("tapretry")) return;   // HARDクリア直後・伝説達成時はボタンのみ
  const act = b ? b.dataset.act : "retry";                 // 画面のどこをタップしても即リトライ
  if (act === "retry") start(S.mode);
  else if (act === "share") share();
  else if (act === "title") renderTitle();
  else if (act === "next") start(b.dataset.mode);
  else if (act === "ex") startEX();
});
document.addEventListener("keydown", e => {
  if (document.querySelector(".modal.on")) {              // モーダル表示中は Esc で閉じるだけ
    if (e.key === "Escape") closeModals();
    return;
  }
  if ($("game").classList.contains("on")) {
    if (e.key === "Escape") return openModal("homeModal");
    const i = "1234".indexOf(e.key) >= 0 ? "1234".indexOf(e.key) : "abcd".indexOf(e.key.toLowerCase());
    if (i >= 0) choose(i);
  } else if ($("result").classList.contains("on") && $("result").classList.contains("tapretry") && (e.key === "Enter" || e.key === " ") && Date.now() - S.resultAt > 100) {
    e.preventDefault(); start(S.mode);
  } else if (e.key === "Escape") renderTitle();
});
$("coffee").href = CONFIG.COFFEE_URL;
renderTitle();
</script>
</body>
</html>
